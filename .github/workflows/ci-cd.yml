name: CI/CD

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      DISCORD_TOKEN: ci
      CLIENT_ID: "0"
      GUILD_ID: "0"
      DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/ci
      DIRECT_URL: postgresql://ci:ci@127.0.0.1:5432/ci
      GEMINI_API_KEY: ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npm test

  deploy:
    name: Deploy
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    concurrency:
      group: deploy-prod
      cancel-in-progress: false
    env:
      AWS_REGION: ${{ vars.AWS_REGION || 'eu-central-1' }}
      EC2_NAME_TAG: ${{ vars.EC2_NAME_TAG || 'punch-machine-prod' }}
      APP_DIR: /home/ubuntu/bot
    steps:
      - name: Verify AWS_ROLE_ARN secret
        env:
          AWS_ROLE_ARN: ${{ secrets.AWS_ROLE_ARN }}
        run: |
          set -euo pipefail
          if [[ -z "${AWS_ROLE_ARN}" ]]; then
            echo "::error::AWS_ROLE_ARN secret is empty. Set it to: arn:aws:iam::094032936258:role/punch-machine-prod-gha" >&2
            exit 1
          fi
          if [[ "${AWS_ROLE_ARN}" != arn:aws:iam::094032936258:role/punch-machine-prod-gha ]]; then
            echo "::error::AWS_ROLE_ARN must be exactly arn:aws:iam::094032936258:role/punch-machine-prod-gha (got suffix: ${AWS_ROLE_ARN##*/})" >&2
            exit 1
          fi

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: github-actions-deploy

      - name: Deploy via SSM
        run: |
          set -euo pipefail

          INSTANCE_IDS="$(aws ec2 describe-instances \
            --filters "Name=tag:Name,Values=${EC2_NAME_TAG}" "Name=instance-state-name,Values=running" \
            --query 'Reservations[].Instances[].InstanceId' \
            --output text)"

          INSTANCE_COUNT="$(printf '%s\n' ${INSTANCE_IDS} | grep -c . || true)"
          if [[ "${INSTANCE_COUNT}" -ne 1 ]]; then
            echo "Expected exactly 1 running instance tagged Name=${EC2_NAME_TAG}, found ${INSTANCE_COUNT}: ${INSTANCE_IDS}" >&2
            exit 1
          fi
          INSTANCE_ID="${INSTANCE_IDS}"
          echo "Target instance: ${INSTANCE_ID}"

          COMMAND_ID="$(aws ssm send-command \
            --instance-ids "${INSTANCE_ID}" \
            --document-name AWS-RunShellScript \
            --comment "dbz-bot deploy ${GITHUB_SHA}" \
            --timeout-seconds 600 \
            --parameters commands="$(jq -cn \
              --arg app "$APP_DIR" \
              '[
                "sudo -u ubuntu git -C \($app) fetch --all",
                "sudo -u ubuntu git -C \($app) checkout main",
                "sudo -u ubuntu git -C \($app) pull --ff-only origin main",
                "sudo bash \($app)/deploy/aws/host-update.sh"
              ]')" \
            --query 'Command.CommandId' \
            --output text)"

          echo "SSM command: ${COMMAND_ID}"

          for _ in $(seq 1 90); do
            STATUS="$(aws ssm get-command-invocation \
              --command-id "${COMMAND_ID}" \
              --instance-id "${INSTANCE_ID}" \
              --query 'Status' \
              --output text 2>/dev/null || echo Pending)"

            case "${STATUS}" in
              Success)
                aws ssm get-command-invocation \
                  --command-id "${COMMAND_ID}" \
                  --instance-id "${INSTANCE_ID}" \
                  --query 'StandardOutputContent' \
                  --output text
                exit 0
                ;;
              Failed|Cancelled|TimedOut|Undeliverable)
                echo "SSM command ${STATUS}" >&2
                aws ssm get-command-invocation \
                  --command-id "${COMMAND_ID}" \
                  --instance-id "${INSTANCE_ID}" \
                  --query '{stdout:StandardOutputContent,stderr:StandardErrorContent,status:Status}' \
                  --output json >&2
                exit 1
                ;;
              *)
                sleep 10
                ;;
            esac
          done

          echo "Timed out waiting for SSM command ${COMMAND_ID}" >&2
          exit 1
