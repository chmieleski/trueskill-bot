name: CI/CD

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      DISCORD_TOKEN: ci
      CLIENT_ID: '0'
      GUILD_ID: '0'
      DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/ci
      DIRECT_URL: postgresql://ci:ci@127.0.0.1:5432/ci
      GEMINI_API_KEY: ci
      HUSKY: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: git config --global url."https://github.com/".insteadOf ssh://git@github.com/
      - run: 'git config --global url."https://github.com/".insteadOf git@github.com:'
      - run: git config --global url."https://github.com/".insteadOf git+ssh://git@github.com/
      - run: npm install -g npm@11
      - run: npm ci
      - run: npx prisma generate
      - run: npm test

  format:
    name: Format
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      HUSKY: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: git config --global url."https://github.com/".insteadOf ssh://git@github.com/
      - run: 'git config --global url."https://github.com/".insteadOf git@github.com:'
      - run: git config --global url."https://github.com/".insteadOf git+ssh://git@github.com/
      - run: npm install -g npm@11
      - run: npm ci
      - run: npm run format:check

  commitlint:
    name: Commitlint
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      HUSKY: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: git config --global url."https://github.com/".insteadOf ssh://git@github.com/
      - run: 'git config --global url."https://github.com/".insteadOf git@github.com:'
      - run: git config --global url."https://github.com/".insteadOf git+ssh://git@github.com/
      - run: npm install -g npm@11
      - run: npm ci
      - name: Lint PR title
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: printf '%s\n' "$TITLE" | npx commitlint

  release:
    name: Release
    needs: [test, format]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    env:
      HUSKY: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: git config --global url."https://github.com/".insteadOf ssh://git@github.com/
      - run: 'git config --global url."https://github.com/".insteadOf git@github.com:'
      - run: git config --global url."https://github.com/".insteadOf git+ssh://git@github.com/
      - run: npm install -g npm@11
      - run: npm ci
      - run: npx semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
      - name: Format changelog after release
        run: npx prettier --write CHANGELOG.md
      - name: Commit formatted changelog
        run: |
          if git diff --quiet CHANGELOG.md; then
            echo "CHANGELOG already formatted"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md
          git commit -m "chore(release): format changelog [skip ci]"
          git push

  deploy:
    name: Deploy
    needs: [test, release]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    concurrency:
      group: deploy-prod
      cancel-in-progress: false
    env:
      AWS_REGION: ${{ vars.AWS_REGION || 'eu-central-1' }}
      EC2_NAME_TAG: ${{ vars.EC2_NAME_TAG || 'punch-machine-prod' }}
      APP_DIR: /home/ubuntu/bot
    steps:
      - name: Verify AWS_ROLE_ARN secret
        env:
          AWS_ROLE_ARN: ${{ secrets.AWS_ROLE_ARN }}
        run: |
          set -euo pipefail
          if [[ -z "${AWS_ROLE_ARN}" ]]; then
            echo "::error::AWS_ROLE_ARN secret is empty. Set it to: arn:aws:iam::094032936258:role/punch-machine-prod-gha" >&2
            exit 1
          fi
          if [[ "${AWS_ROLE_ARN}" != arn:aws:iam::094032936258:role/punch-machine-prod-gha ]]; then
            echo "::error::AWS_ROLE_ARN must be exactly arn:aws:iam::094032936258:role/punch-machine-prod-gha (got suffix: ${AWS_ROLE_ARN##*/})" >&2
            exit 1
          fi

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: github-actions-deploy

      - name: Deploy via SSM
        run: |
          set -euo pipefail

          INSTANCE_IDS="$(aws ec2 describe-instances \
            --filters "Name=tag:Name,Values=${EC2_NAME_TAG}" "Name=instance-state-name,Values=running" \
            --query 'Reservations[].Instances[].InstanceId' \
            --output text)"

          INSTANCE_COUNT="$(printf '%s\n' ${INSTANCE_IDS} | grep -c . || true)"
          if [[ "${INSTANCE_COUNT}" -ne 1 ]]; then
            echo "Expected exactly 1 running instance tagged Name=${EC2_NAME_TAG}, found ${INSTANCE_COUNT}: ${INSTANCE_IDS}" >&2
            exit 1
          fi
          INSTANCE_ID="${INSTANCE_IDS}"
          echo "Target instance: ${INSTANCE_ID}"

          echo "==> Waiting for SSM agent to accept commands"
          SSM_OK=0
          for _ in $(seq 1 60); do
            PING="$(aws ssm describe-instance-information \
              --filters "Key=InstanceIds,Values=${INSTANCE_ID}" \
              --query 'InstanceInformationList[0].PingStatus' \
              --output text 2>/dev/null || true)"
            if [[ "${PING}" == "Online" ]]; then
              echo "SSM PingStatus=Online"
              SSM_OK=1
              break
            fi

            # Fallback when DescribeInstanceInformation is denied / empty:
            # a tiny RunShellScript proves the agent is reachable.
            PROBE_ID="$(aws ssm send-command \
              --instance-ids "${INSTANCE_ID}" \
              --document-name AWS-RunShellScript \
              --comment "dbz-bot ssm-probe ${GITHUB_SHA}" \
              --timeout-seconds 30 \
              --parameters commands='["echo ok"]' \
              --query 'Command.CommandId' \
              --output text 2>/dev/null || true)"
            if [[ -n "${PROBE_ID}" && "${PROBE_ID}" != "None" ]]; then
              for __ in $(seq 1 15); do
                PSTATUS="$(aws ssm get-command-invocation \
                  --command-id "${PROBE_ID}" \
                  --instance-id "${INSTANCE_ID}" \
                  --query 'Status' \
                  --output text 2>/dev/null || echo Pending)"
                case "${PSTATUS}" in
                  Success)
                    echo "SSM probe Success (PingStatus=${PING:-unknown})"
                    SSM_OK=1
                    break 2
                    ;;
                  Failed|Cancelled|TimedOut|Undeliverable)
                    echo "SSM probe ${PSTATUS} (PingStatus=${PING:-unknown})"
                    break
                    ;;
                  *)
                    sleep 2
                    ;;
                esac
              done
            else
              echo "SSM not ready yet (PingStatus=${PING:-unknown})"
            fi
            sleep 5
          done
          if [[ "${SSM_OK}" -ne 1 ]]; then
            echo "SSM agent not accepting commands for ${INSTANCE_ID}" >&2
            exit 1
          fi

          echo "==> Waiting for /var/lib/dbz-bot/ready (first-boot / prior deploy finished)"
          READY=0
          for _ in $(seq 1 90); do
            READY_CMD="$(aws ssm send-command \
              --instance-ids "${INSTANCE_ID}" \
              --document-name AWS-RunShellScript \
              --comment "dbz-bot ready-check ${GITHUB_SHA}" \
              --timeout-seconds 30 \
              --parameters commands='["bash -lc '\''test -f /var/lib/dbz-bot/ready && echo READY || echo NOT_READY'\''"]' \
              --query 'Command.CommandId' \
              --output text)"
            for __ in $(seq 1 12); do
              RSTATUS="$(aws ssm get-command-invocation \
                --command-id "${READY_CMD}" \
                --instance-id "${INSTANCE_ID}" \
                --query 'Status' \
                --output text 2>/dev/null || echo Pending)"
              case "${RSTATUS}" in
                Success|Failed|Cancelled|TimedOut|Undeliverable) break ;;
                *) sleep 2 ;;
              esac
            done
            ROUT="$(aws ssm get-command-invocation \
              --command-id "${READY_CMD}" \
              --instance-id "${INSTANCE_ID}" \
              --query 'StandardOutputContent' \
              --output text 2>/dev/null || true)"
            echo "ready-check: ${ROUT:-"(empty)"} (${RSTATUS})"
            if [[ "${ROUT}" == *READY* ]]; then
              READY=1
              break
            fi
            sleep 10
          done
          if [[ "${READY}" -ne 1 ]]; then
            echo "Timed out waiting for /var/lib/dbz-bot/ready on ${INSTANCE_ID}" >&2
            exit 1
          fi

          # Single bash -lc so pipefail works under SSM (default shell is dash).
          # Stop the bot before pull/update so npm ci cannot race a live process.
          COMMAND_ID="$(aws ssm send-command \
            --instance-ids "${INSTANCE_ID}" \
            --document-name AWS-RunShellScript \
            --comment "dbz-bot deploy ${GITHUB_SHA}" \
            --timeout-seconds 900 \
            --parameters commands="$(jq -cn \
              --arg app "$APP_DIR" \
              --arg sha "$GITHUB_SHA" \
              '
                [
                  (
                    [
                      "set -euo pipefail",
                      "echo ==> deploy \($sha)",
                      "systemctl stop dbz-bot || true",
                      "sudo -u ubuntu git -C \($app) fetch --all",
                      "sudo -u ubuntu git -C \($app) checkout main",
                      "sudo -u ubuntu git -C \($app) pull --ff-only origin main",
                      "if [[ -f \($app)/deploy/aws/ensure-swap.sh ]]; then sudo bash \($app)/deploy/aws/ensure-swap.sh; fi",
                      "sudo bash \($app)/deploy/aws/host-update.sh"
                    ] | join("; ")
                  ) as $body
                  | "bash -lc " + ($body | @sh)
                ]
              ')" \
            --query 'Command.CommandId' \
            --output text)"

          echo "SSM command: ${COMMAND_ID}"

          LAST_OUT=""
          for _ in $(seq 1 120); do
            INV="$(aws ssm get-command-invocation \
              --command-id "${COMMAND_ID}" \
              --instance-id "${INSTANCE_ID}" \
              --output json 2>/dev/null || echo '{}')"
            STATUS="$(jq -r '.Status // "Pending"' <<<"${INV}")"
            OUT="$(jq -r '.StandardOutputContent // empty' <<<"${INV}")"
            ERR="$(jq -r '.StandardErrorContent // empty' <<<"${INV}")"

            if [[ -n "${OUT}" && "${OUT}" != "${LAST_OUT}" ]]; then
              # Print only new suffix when SSM finally attaches buffered output.
              printf '%s\n' "${OUT#"${LAST_OUT}"}"
              LAST_OUT="${OUT}"
            fi

            case "${STATUS}" in
              Success)
                [[ -n "${OUT}" ]] || jq -r '.StandardOutputContent // empty' <<<"${INV}"
                exit 0
                ;;
              Failed|Cancelled|TimedOut|Undeliverable)
                echo "SSM command ${STATUS}" >&2
                jq '{stdout: .StandardOutputContent, stderr: .StandardErrorContent, status: .Status}' <<<"${INV}" >&2
                exit 1
                ;;
              *)
                echo "… ${STATUS}"
                sleep 10
                ;;
            esac
          done

          echo "Timed out waiting for SSM command ${COMMAND_ID}" >&2
          aws ssm get-command-invocation \
            --command-id "${COMMAND_ID}" \
            --instance-id "${INSTANCE_ID}" \
            --query '{stdout:StandardOutputContent,stderr:StandardErrorContent,status:Status}' \
            --output json >&2 || true
          exit 1
